<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mouse Maze</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="labyrinthCanvas"></canvas>
    <div id="overlay">
        <div id="instructions">
            <h1>3D MOUSE MAZE</h1>
            <p>Move your mouse to tilt the maze and guide the ball</p>
            <p>Avoid the holes or you'll fall and restart!</p>
            <p class="small">Press R to restart anytime</p>
        </div>
        <div id="gameOver" class="hidden">
            <h1>GAME OVER</h1>
            <p>You fell into a hole!</p>
            <button id="restartBtn">Restart Game</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon/0.6.2/cannon.min.js"></script>
    <script src="labyrinth.js"></script>
</body>
</html>
