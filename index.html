<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tilt Labyrinth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <canvas id="labyrinthCanvas"></canvas>
        <div id="controls">
            <h2>3D Tilt Labyrinth</h2>
            <p>Click the tilt buttons to guide the sphere through the maze</p>
            <div class="button-grid">
                <button id="tiltUp" class="tilt-btn">↑ Tilt Up</button>
                <button id="tiltDown" class="tilt-btn">↓ Tilt Down</button>
                <button id="tiltLeft" class="tilt-btn">← Tilt Left</button>
                <button id="tiltRight" class="tilt-btn">→ Tilt Right</button>
            </div>
            <div id="status">
                <p>Tilts: <span id="tiltCount">0</span> / 4</p>
                <p id="message">Start tilting to move the sphere!</p>
            </div>
            <button id="reset" class="reset-btn">Reset</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="labyrinth.js"></script>
</body>
</html>
